<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="styles.css" />
  <title>Hybrid Chris - Contact</title>
</head>
<body>
  <header>
    <h1>Contact Us</h1>
    <p>Have questions or need help? Reach out to us below!</p>
  </header>

  <section class="contact-form">
    <form>
      <label for="phone">Phone Number:</label><br />
      <input type="tel" id="phone" name="phone" placeholder="123-456-7890" required /><br /><br />

      <label for="email">Email:</label><br />
      <input type="email" id="email" name="email" placeholder="you@example.com" required /><br /><br />

      <label for="message">How can we help?</label><br />
      <textarea id="message" name="message" rows="5" placeholder="Type your question here..." required></textarea><br /><br />

      <button type="submit">Submit</button>
    </form>
  </section>

  <footer>
    <nav>
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="physical-tests.html">Physical Tests</a></li>
        <li><a href="gear.html">Gear</a></li>
        <li><a href="training-plans.html">Training Plans</a></li>
      </ul>
    </nav>
  </footer>
</body>
</html>
